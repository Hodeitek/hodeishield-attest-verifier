name: Release

# A pushed v* tag builds a DRAFT release: the verifier script, the key statement
# (docs/security/keys.json, as keys-statement.json), the SPDX SBOM of the script
# (verify-attestation.sh.spdx.json), the in-browser verifier page as a reproducible
# bundle (verify-page-<tag>.tar.gz, issue #25), SHA256SUMS, and a Sigstore keyless
# signature bundle for each. The owner reviews and publishes
# the draft by hand; this workflow never publishes a non-draft release. The draft
# is made only after the page has passed all 130 cases of tests/vectors/v1 in
# headless Chrome and Firefox (web-vectors).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tests:
    name: offline tests (valid + rejection)
    runs-on: ubuntu-latest
    container: debian:trixie-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same packages and Latin-1 locale as ci.yml's test job, from one
      # list, plus shellcheck (tests/test-deps-parity.sh checks it on every
      # pull request; the v1.4.1 tag failed on a package only ci.yml had, #84).
      - name: Install the test packages, the Latin-1 locale and shellcheck
        run: bash .github/scripts/install-test-deps.sh shellcheck
      - name: shellcheck
        run: shellcheck scripts/attest/verify-attestation.sh tests/run.sh tests/vectors.sh tests/mutants.sh tests/live.sh tests/keys-consistency.sh tests/keys-drift.sh tests/version-consistency.sh tests/sbom.sh .github/scripts/generate-sbom.sh tests/test-deps-parity.sh .github/scripts/install-test-deps.sh tests/web-vectors.sh tests/web-static.sh tests/web-bundle.sh tests/web-differential.sh tools/verify-page/build.sh tools/verify-page/check.sh
      - name: keys.json matches keys.md
        run: bash tests/keys-consistency.sh
      # The release commit sets VERIFIER_VERSION to the tag and dates the
      # CHANGELOG heading; otherwise nothing is signed.
      - name: VERIFIER_VERSION equals the tag, and the changelog is dated
        env:
          TAG: ${{ github.ref_name }}
        run: bash tests/version-consistency.sh --tag "$TAG"
      - name: SBOM generator
        run: bash tests/sbom.sh
      - name: tests/run.sh
        env:
          VERIFIER_REQUIRE_LATIN1: "1"
        run: bash tests/run.sh

  # The ML-DSA-65 module of the page, built in the pinned container
  # (tools/mldsa-wasm). Its bytes must be the ones tools/mldsa-wasm/expected.sha256
  # pins: a build that differs stops the release.
  wasm:
    name: build the ML-DSA-65 WebAssembly module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the module
        run: |
          set -euo pipefail
          bash tools/mldsa-wasm/build.sh "$RUNNER_TEMP/wasm"
          cd "$RUNNER_TEMP/wasm"
          sha256sum -c "$GITHUB_WORKSPACE/tools/mldsa-wasm/expected.sha256"
      - name: Keep the module for the jobs that need it
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mldsa-wasm
          path: ${{ runner.temp }}/wasm
          if-no-files-found: error
          retention-days: 7

  web-static:
    name: page policy and interface languages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tests/web-static.sh
        run: bash tests/web-static.sh
      - name: The page bundle is reproducible and has the shape pages.yml needs
        run: bash tests/web-bundle.sh

  # All 130 cases of tests/vectors/v1, on the page as it will be shipped, in real
  # headless Google Chrome and Firefox (both are on ubuntu-latest), from http and
  # from disk. The draft release needs this job.
  web-vectors:
    name: web vectors (Chrome and Firefox)
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the module
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mldsa-wasm
          path: ${{ runner.temp }}/wasm
      - name: Browsers
        run: |
          google-chrome --version
          firefox --version
      - name: tests/web-vectors.sh
        run: bash tests/web-vectors.sh --wasm "$RUNNER_TEMP/wasm"

  # The page's logic and the real script, on the same arguments, must agree on exit
  # code, verdict and reason code, on inputs the 130 vectors do not cover. It needs
  # what the script needs (OpenSSL 3.5), so it runs in the Debian container.
  web-differential:
    name: web page and script agree (differential)
    needs: wasm
    runs-on: ubuntu-latest
    container: debian:trixie-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the script's dependencies, and Node for the page's logic
        run: bash .github/scripts/install-test-deps.sh nodejs
      - name: Fetch the module
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mldsa-wasm
          path: ${{ runner.temp }}/wasm
      - name: tests/web-differential.sh
        run: bash tests/web-differential.sh --wasm "$RUNNER_TEMP/wasm"

  publish:
    name: sign and draft release
    needs: [tests, web-static, web-vectors, web-differential, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the draft release and upload assets
      id-token: write # for cosign's Sigstore keyless (OIDC) signing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The SBOM is made from the staged script, and its date is the tagged
      # commit's, not the clock, so the same tag gives the same bytes. An empty
      # or missing SBOM stops the release here, before anything is signed.
      - name: Fetch the module the page tests used
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mldsa-wasm
          path: ${{ runner.temp }}/wasm

      # The page bundle is built from web/ and that module only; the same tag
      # gives the same bytes (sorted names, owner 0:0, fixed modes, mtime of the
      # tagged commit, gzip -n). It is built twice here and the two must be equal.
      - name: Stage the artefact, the SBOM, the page bundle and SHA256SUMS
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir dist
          cp scripts/attest/verify-attestation.sh dist/
          cp docs/security/keys.json dist/keys-statement.json
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            bash .github/scripts/generate-sbom.sh dist/verify-attestation.sh > dist/verify-attestation.sh.spdx.json
          [ -s dist/verify-attestation.sh.spdx.json ] || { echo "the SBOM is empty" >&2; exit 1; }
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          bash tools/verify-page/build.sh "$RUNNER_TEMP/wasm" "$RUNNER_TEMP/page-a" "dist/verify-page-${TAG}.tar.gz"
          bash tools/verify-page/build.sh "$RUNNER_TEMP/wasm" "$RUNNER_TEMP/page-b" "$RUNNER_TEMP/again.tar.gz"
          cmp "dist/verify-page-${TAG}.tar.gz" "$RUNNER_TEMP/again.tar.gz" || { echo "the page bundle is not reproducible" >&2; exit 1; }
          cd dist
          sha256sum verify-attestation.sh keys-statement.json verify-attestation.sh.spdx.json "verify-page-${TAG}.tar.gz" > SHA256SUMS
          cat SHA256SUMS
          # shellcheck disable=SC2016 # the backticks are Markdown, not a command
          {
            printf '## Verify in your browser\n\n'
            printf 'The page is the asset `verify-page-%s.tar.gz`, with sha256 `%s`. It is listed in `SHA256SUMS`, which is signed.\n' \
              "$TAG" "$(sha256sum "verify-page-${TAG}.tar.gz" | cut -d' ' -f1)"
            printf 'Unpack it and open `index.html` from your disk, or compare it with the files the site serves: see docs/security/browser-verifier.md.\n'
            printf 'The bash script remains the reference verifier.\n\n'
          } > "$RUNNER_TEMP/notes.md"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      # Keyless: cosign gets a short-lived Fulcio certificate for this job's
      # GitHub OIDC identity and records the signature in the public Rekor log.
      # No signing key or secret exists anywhere.
      - name: Sign the script, the key statement, the SBOM, the page bundle and SHA256SUMS
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for f in verify-attestation.sh keys-statement.json verify-attestation.sh.spdx.json "verify-page-${TAG}.tar.gz" SHA256SUMS; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done

      # Run the exact check README.md tells a reader to run, so a draft whose
      # published instructions would fail never reaches the owner.
      - name: Verify the bundles as a reader would
        working-directory: dist
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          grep -q '  verify-attestation.sh.spdx.json$' SHA256SUMS || { echo "SHA256SUMS does not list the SBOM" >&2; exit 1; }
          grep -q "  verify-page-${TAG}.tar.gz\$" SHA256SUMS || { echo "SHA256SUMS does not list the page bundle" >&2; exit 1; }
          for f in verify-attestation.sh keys-statement.json verify-attestation.sh.spdx.json "verify-page-${TAG}.tar.gz" SHA256SUMS; do
            cosign verify-blob --bundle "${f}.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$f"
          done
          # The bundle as a reader would use it: index.html at the root, no path
          # that leaves the folder, nothing but files and folders, and every file
          # as the manifest inside it says.
          bundle="verify-page-${TAG}.tar.gz"
          tar -tzf "$bundle" | grep -qx './index.html' || { echo "index.html is not at the root of the bundle" >&2; exit 1; }
          if tar -tzf "$bundle" | grep -Eq '(^|/)\.\.(/|$)|^/'; then echo "the bundle has an absolute path or .." >&2; exit 1; fi
          if tar -tzvf "$bundle" | grep -v '^[-d]' | grep -q .; then echo "the bundle has entries that are not plain files or folders" >&2; exit 1; fi
          rm -rf "$RUNNER_TEMP/unpacked"
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$bundle" -C "$RUNNER_TEMP/unpacked" --no-same-owner --no-same-permissions
          bash "$GITHUB_WORKSPACE/tools/verify-page/check.sh" "$RUNNER_TEMP/unpacked"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            dist/*
