name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# The rule applies from this commit on: history published before it is left
# as is. It is the head of dev (main included) when the rule was adopted.
env:
  CUTOFF: e56bd2f3b26e2d90edea78c143a5c16f5a59b9b4

jobs:
  dco:
    name: DCO sign-off
    # Only pull requests opened from forks are checked.
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit must be signed off by its author
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          fail=0
          while read -r sha; do
            author=$(git log -1 --format=%ae "$sha")
            ok=0
            while read -r trailer; do
              email=${trailer##*<}
              email=${email%%>*}
              if [[ "${email,,}" == "${author,,}" ]]; then
                ok=1
              fi
            done < <(git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -E '^.+ <[^<>]+>$' || true)
            if [ "$ok" -ne 1 ]; then
              echo "::error::commit $sha has no Signed-off-by matching its author $author"
              fail=1
            fi
          done < <(git rev-list --no-merges "origin/${BASE_REF}..${HEAD_SHA}" "^${CUTOFF}")
          exit "$fail"
