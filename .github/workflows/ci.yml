name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The container jobs run on Debian 13, which ships OpenSSL 3.5, the first
# release with ML-DSA (FIPS 204). The image is pinned by digest so a rebuilt
# tag cannot change what the tests ran on. README.md and container.yml carry
# the same digest and must change in the same commit (tests/container.sh checks).
jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    container: debian:trixie-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends shellcheck
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck scripts/attest/verify-attestation.sh tests/run.sh tests/vectors.sh tests/mutants.sh tests/live.sh tests/container.sh tests/keys-consistency.sh tests/keys-drift.sh tests/image-smoke.sh tests/version-consistency.sh tests/image-assets.sh tests/spdx-headers.sh tests/test-deps-parity.sh .github/scripts/install-test-deps.sh tests/live-image.sh tests/live-image-modes.sh .github/scripts/fetch-release-assets.sh .github/scripts/semgrep-parses.sh tests/sbom.sh .github/scripts/generate-sbom.sh tests/web-vectors.sh tests/web-static.sh tests/web-bundle.sh tests/web-differential.sh tools/verify-page/build.sh tools/verify-page/check.sh

  # Semgrep's bash parser is stricter than bash: one construct it does not read
  # (10# in $(( )), a case with a pattern on the line of `in`) makes it drop the
  # file, and a scan that parsed nothing reports no finding. This fails the
  # build if the script is not parsed completely. Semgrep is the official image,
  # pinned by version and digest (1.163.0), run with no network and the file
  # mounted read-only; it is not logged in, sends no metrics and does not check
  # for a newer version.
  semgrep-parse:
    name: Semgrep parses the script
    runs-on: ubuntu-latest
    env:
      SEMGREP_IMAGE: semgrep/semgrep:1.163.0@sha256:7cad2bc2d1e44f87f0bf4be6d1fa23aa90fb72015bebc89fb91385d813987a03
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull the Semgrep image
        run: docker pull "$SEMGREP_IMAGE"
      - name: semgrep --lang bash parses verify-attestation.sh
        run: bash .github/scripts/semgrep-parses.sh scripts/attest/verify-attestation.sh

  # Every tracked shell script, workflow and Dockerfile carries the licence
  # header. It reads `git ls-files`, so it runs on the runner, not in the
  # Debian test container, which has no git.
  spdx:
    name: licence headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tests/spdx-headers.sh
        run: bash tests/spdx-headers.sh

  # The in-browser verifier page (issue #25). Three jobs, none of which needs the
  # Debian container: the ML-DSA-65 module builds in its pinned container and must
  # have the pinned bytes; the page's policy and languages are checked statically;
  # and all 136 cases of tests/vectors/v1 run in real headless Chrome and Firefox
  # (both are on ubuntu-latest), from http and from disk, on the page as it is
  # shipped. Safari is not tested.
  wasm-build:
    name: ML-DSA-65 module builds, same bytes as pinned
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tools/mldsa-wasm/build.sh
        run: |
          set -euo pipefail
          bash tools/mldsa-wasm/build.sh "$RUNNER_TEMP/wasm"
          cd "$RUNNER_TEMP/wasm"
          sha256sum -c "$GITHUB_WORKSPACE/tools/mldsa-wasm/expected.sha256"
      - name: Keep the module for web-vectors
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mldsa-wasm
          path: ${{ runner.temp }}/wasm
          if-no-files-found: error
          retention-days: 3

  web-static:
    name: web page policy and interface languages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tests/web-static.sh
        run: bash tests/web-static.sh
      - name: The page bundle is reproducible and has the shape pages.yml needs
        run: bash tests/web-bundle.sh

  web-vectors:
    name: web vectors (Chrome and Firefox)
    needs: wasm-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the module
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mldsa-wasm
          path: ${{ runner.temp }}/wasm
      - name: Browsers
        run: |
          google-chrome --version
          firefox --version
      - name: tests/web-vectors.sh
        run: bash tests/web-vectors.sh --wasm "$RUNNER_TEMP/wasm"

  # The page's logic and the real script, on the same arguments, must agree on exit
  # code, verdict and reason code, on inputs the 136 vectors do not cover. It needs
  # what the script needs (OpenSSL 3.5), so it runs in the Debian container.
  web-differential:
    name: web page and script agree (differential)
    needs: wasm-build
    runs-on: ubuntu-latest
    container: debian:trixie-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the script's dependencies, and Node for the page's logic
        run: bash .github/scripts/install-test-deps.sh nodejs
      - name: Fetch the module
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mldsa-wasm
          path: ${{ runner.temp }}/wasm
      - name: tests/web-differential.sh
        run: bash tests/web-differential.sh --wasm "$RUNNER_TEMP/wasm"

  tests:
    name: offline tests (valid + rejection)
    runs-on: ubuntu-latest
    container: debian:trixie-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The packages and the Latin-1 locale the suite needs, from the one list
      # release.yml's test job uses too (tests/test-deps-parity.sh checks it).
      # No jq: a step right before tests/run.sh fails the job if jq is on the PATH.
      - name: Install the test packages and the Latin-1 locale
        run: bash .github/scripts/install-test-deps.sh
      - name: Toolchain
        run: |
          openssl version
          openssl list -signature-algorithms | grep -i ml-dsa-65
          python3 --version
      # cosign, the version and the installer release.yml pins. It is needed by
      # the vectors with real Sigstore bundles (tests/vectors/v1/anchor/), which
      # tests/vectors.sh skips where cosign is missing; the stub-based anchor
      # tests in tests/run.sh do not need it.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"
      - name: cosign version
        run: cosign version
      # VERIFIER_VERSION is the version --anchor-file compares a statement's
      # release tag with: it must agree with CHANGELOG.md.
      - name: VERIFIER_VERSION agrees with CHANGELOG.md
        run: bash tests/version-consistency.sh
      # The release path of image.yml never runs on a pull request; this checks
      # it covers every file release.yml lists in SHA256SUMS, offline.
      - name: image.yml covers every file in SHA256SUMS
        run: bash tests/image-assets.sh
      # The SPDX SBOM that release.yml attaches to each release.
      - name: SBOM generator
        run: bash tests/sbom.sh
      # The skip-or-fail logic of the live image check, with stubbed curl,
      # docker, cosign and gh; the check itself needs a published image.
      - name: tests/live-image.sh skips or fails correctly
        run: bash tests/live-image-modes.sh
      # release.yml's test job installs what this one does (#84).
      - name: release.yml's test job installs what this one does
        run: bash tests/test-deps-parity.sh
      - name: jq is not installed
        run: |
          if command -v jq >/dev/null 2>&1; then echo "jq is on the PATH: $(command -v jq)" >&2; exit 1; fi
      - name: tests/run.sh
        env:
          VERIFIER_REQUIRE_LATIN1: "1"
        run: bash tests/run.sh

  # The README says an OpenSSL without ML-DSA is "a limit of your tooling, not
  # evidence against the document", i.e. exit 2, never 1. The hosted Ubuntu
  # image still ships OpenSSL 3.0, which makes it the right place to hold the
  # verifier to that.
  old-openssl:
    name: old OpenSSL is exit 2, not 1
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verifier refuses to judge with OpenSSL < 3.5
        run: |
          set -uo pipefail
          openssl version
          if openssl list -signature-algorithms | grep -qi ml-dsa; then
            echo "::notice title=old-openssl::this runner's OpenSSL supports ML-DSA; nothing to check"
            exit 0
          fi
          echo '{}' > att.json; echo '{"keys":[]}' > jwks.json
          # The step shell runs with -e; capture the expected non-zero exit
          # instead of letting it end the step.
          rc=0
          bash scripts/attest/verify-attestation.sh --attestation att.json --jwks jwks.json > out 2>&1 || rc=$?
          cat out
          [ "$rc" -eq 2 ] || { echo "::error::expected exit 2, got $rc"; exit 1; }
          grep -qF 'is too old' out || { echo "::error::no 'is too old' message"; exit 1; }

  # LibreSSL (the `openssl` on macOS, and Homebrew's 4.x) prints a version
  # >= 3.5 and has no ML-DSA. It must be "could not check" (2) with "not ML-DSA
  # capable", never reported as a capable OpenSSL and never 1. Alpine ships
  # LibreSSL as `libressl`; it is linked as `openssl`, as macOS presents it.
  libressl:
    name: LibreSSL is exit 2, not 1
    runs-on: ubuntu-latest
    container: alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
    steps:
      - name: Install bash, python3, libressl
        run: apk add --no-cache bash python3 libressl
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verifier refuses to judge with LibreSSL
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/bin && ln -sf "$(command -v libressl)" /tmp/bin/openssl
          export PATH="/tmp/bin:$PATH"
          openssl version
          cd tests/vectors/v1
          rc=0
          bash ../../../scripts/attest/verify-attestation.sh --attestation attestations/valid.json \
            --jwks keys/test-only-issuer-jwks.json --expect-slug fixture-org \
            --expect-issuer https://issuer.test --now 1767225900 > /tmp/out 2>&1 || rc=$?
          cat /tmp/out
          [ "$rc" -eq 2 ] || { echo "::error::expected exit 2, got $rc"; exit 1; }
          grep -qF 'not ML-DSA capable' /tmp/out || { echo "::error::no 'not ML-DSA capable' message"; exit 1; }
          if grep -qF 'PASS  OpenSSL' /tmp/out; then echo "::error::LibreSSL was reported as an ML-DSA capable OpenSSL"; exit 1; fi
