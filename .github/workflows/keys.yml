name: Keys

# docs/security/keys.json is the source of the signed key statement published
# with each release. It must say exactly what docs/security/keys.md says.
# Static: no document is run and nothing is fetched.
on:
  push:
    branches: [dev, main]
    paths:
      - "docs/security/keys.json"
      - "docs/security/keys.md"
      - "tests/keys-consistency.sh"
      - ".github/workflows/keys.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "docs/security/keys.json"
      - "docs/security/keys.md"
      - "tests/keys-consistency.sh"
      - ".github/workflows/keys.yml"
  workflow_dispatch:

concurrency:
  group: keys-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  consistency:
    name: keys.json matches keys.md
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tests/keys-consistency.sh
        run: bash tests/keys-consistency.sh
